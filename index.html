<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gingerbread's Gathering 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --card-bg: #ffffff;
      --text: #2c3e50;
      --primary: #3182ce;
      --accent: #27ae60;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 1.5rem 1rem;
      min-height: 100vh;
    }
    .wrapper {
      background: var(--card-bg);
      max-width: 440px;
      width: 100%;
      border-radius: 24px;
      padding: 1.8rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    .header-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 0.25rem;
    }
    .header-sub {
      font-size: 0.88rem;
      color: #718096;
      margin-bottom: 1.25rem;
    }
    .active-user-banner {
      background: #ebf8ff;
      border: 1px solid #bee3f8;
      color: #2b6cb0;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 1rem;
      text-align: center;
    }
    .draw-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }
    .person-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fafafa;
      border: 1px solid #eef0f2;
      padding: 0.85rem 1.1rem;
      border-radius: 14px;
      transition: all 0.2s ease;
    }
    .person-row.is-me {
      background: #fff;
      border: 2px solid var(--primary);
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(49, 130, 206, 0.15);
    }
    .person-name {
      font-weight: 600;
      font-size: 0.98rem;
      color: #2d3748;
    }
    .badge {
      font-size: 0.82rem;
      padding: 0.35rem 0.75rem;
      border-radius: 8px;
      font-weight: 600;
    }
    .badge-locked { background: #edf2f7; color: #a0aec0; }
    .badge-tap { background: var(--primary); color: #fff; }
    .badge-revealed { background: #c6f6d5; color: #22543d; font-weight: 700; }

    /* Admin Section */
    .admin-toggle {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #a0aec0;
      cursor: pointer;
    }
    .admin-box {
      display: none;
      margin-top: 1rem;
      padding: 1.2rem;
      background: #f7fafc;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      font-size: 0.85rem;
    }
    .admin-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .admin-tab-btn {
      flex: 1;
      padding: 0.4rem;
      font-size: 0.75rem;
      border-radius: 6px;
      border: 1px solid #cbd5e0;
      background: #fff;
      cursor: pointer;
      font-weight: 600;
    }
    .admin-tab-btn.active {
      background: #2d3748;
      color: #fff;
      border-color: #2d3748;
    }
    .share-row, .master-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.35rem 0;
      border-bottom: 1px solid #edf2f7;
    }
    .btn-wa {
      background: #25d366;
      color: #fff;
      text-decoration: none;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .btn-copy {
      width: 100%;
      background: #2b6cb0;
      color: #fff;
      border: none;
      padding: 0.6rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.75rem;
    }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="header-title">Gingerbread's Gathering 2026</div>
  <div class="header-sub">Christmas Exchange Gifts</div>

  <div id="userBanner" class="active-user-banner" style="display:none;"></div>

  <!-- Normal View (Locked for Participants) -->
  <div class="draw-list" id="listContainer"></div>

  <!-- Organizer Footer Trigger -->
  <div class="admin-toggle" onclick="toggleAdmin()">⚙️ Organizer Control Panel</div>

  <div class="admin-box" id="adminBox">
    <div id="adminAuth">
      <input type="password" id="adminPin" placeholder="Organizer PIN (2026)" style="width:100%; padding:0.5rem; margin-bottom:0.5rem; border:1px solid #cbd5e0; border-radius:6px;" />
      <button onclick="unlockAdmin()" style="width:100%; padding:0.5rem; background:#3182ce; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Unlock Organizer View</button>
    </div>

    <div id="adminDashboard" style="display:none;">
      <div class="admin-tabs">
        <button class="admin-tab-btn active" id="tabMasterBtn" onclick="switchTab('master')">👀 Master List (All)</button>
        <button class="admin-tab-btn" id="tabShareBtn" onclick="switchTab('share')">📲 WhatsApp Links</button>
      </div>

      <!-- Tab 1: Full View for Organizer Only -->
      <div id="tabMaster">
        <div id="masterListContent"></div>
        <button class="btn-copy" onclick="copyMasterHistory()">📋 Copy 2026 Draw to Clipboard</button>
      </div>

      <!-- Tab 2: Individual Links to send -->
      <div id="tabShare" style="display:none;">
        <div id="shareListContent"></div>
      </div>
    </div>
  </div>
</div>

<script>
  // Locked 2026 Pairings (None from 2025 repeated, no self-picks)
  const PAIRINGS_2026 = {
    "Pera": "Elzie",
    "Via": "Rozabelle",
    "Leara": "Pera",
    "Rozabelle": "Via",
    "Niki": "Gimbo",
    "Evelyn": "Merry",
    "Gadi": "Lulong",
    "Ching": "Niki",
    "Merry": "Evelyn",
    "Lulong": "Leara",
    "Gimbs": "Ching",
    "Elzie": "Gadi"
  };

  const PARTICIPANTS = Object.keys(PAIRINGS_2026);

  // Check if link has ?user=Name
  const urlParams = new URLSearchParams(window.location.search);
  const currentUser = urlParams.get('user');

  const banner = document.getElementById("userBanner");
  if (currentUser && PARTICIPANTS.some(p => p.toLowerCase() === currentUser.toLowerCase())) {
    const matchedName = PARTICIPANTS.find(p => p.toLowerCase() === currentUser.toLowerCase());
    banner.style.display = "block";
    banner.textContent = `👋 Hello ${matchedName}! Tap your card below to unwrap.`;
  }

  // Render main screen
  const container = document.getElementById("listContainer");
  PARTICIPANTS.forEach(name => {
    const row = document.createElement("div");
    row.className = "person-row";

    const isMe = currentUser && (currentUser.toLowerCase() === name.toLowerCase());

    if (isMe) {
      row.classList.add("is-me");
      row.innerHTML = `
        <span class="person-name">${name}</span>
        <span class="badge badge-tap" id="badge-${name}">🎁 Tap to Reveal</span>
      `;
      row.onclick = () => revealCard(name);
    } else {
      row.innerHTML = `
        <span class="person-name">${name}</span>
        <span class="badge badge-locked">🔒 Hidden</span>
      `;
    }
    container.appendChild(row);
  });

  function revealCard(name) {
    const badge = document.getElementById(`badge-${name}`);
    if (badge.classList.contains("badge-revealed")) return;

    badge.className = "badge badge-revealed";
    badge.textContent = `drew ${PAIRINGS_2026[name]}! 🎁`;

    confetti({ particleCount: 75, spread: 60, origin: { y: 0.6 } });
  }

  // Admin controls
  function toggleAdmin() {
    const box = document.getElementById("adminBox");
    box.style.display = box.style.display === "block" ? "none" : "block";
  }

  function unlockAdmin() {
    const pin = document.getElementById("adminPin").value;
    if (pin === "2026") {
      document.getElementById("adminAuth").style.display = "none";
      document.getElementById("adminDashboard").style.display = "block";
      renderOrganizerTabs();
    } else {
      alert("Incorrect PIN");
    }
  }

  function switchTab(tab) {
    document.getElementById("tabMaster").style.display = (tab === 'master') ? 'block' : 'none';
    document.getElementById("tabShare").style.display = (tab === 'share') ? 'block' : 'none';
    document.getElementById("tabMasterBtn").classList.toggle('active', tab === 'master');
    document.getElementById("tabShareBtn").classList.toggle('active', tab === 'share');
  }

  function renderOrganizerTabs() {
    const masterContainer = document.getElementById("masterListContent");
    const shareContainer = document.getElementById("shareListContent");
    const baseUrl = window.location.origin + window.location.pathname;

    masterContainer.innerHTML = "";
    shareContainer.innerHTML = "";

    PARTICIPANTS.forEach(giver => {
      const recipient = PAIRINGS_2026[giver];

      // Tab 1: Organizer View
      const mRow = document.createElement("div");
      mRow.className = "master-row";
      mRow.innerHTML = `<span><strong>${giver}</strong></span> <span>➔</span> <span style="color:#27ae60; font-weight:bold;">${recipient}</span>`;
      masterContainer.appendChild(mRow);

      // Tab 2: WhatsApp Share links
      const link = `${baseUrl}?user=${encodeURIComponent(giver)}`;
      const waMsg = encodeURIComponent(`🎄 Gingerbread Gathering 2026: Hi ${giver}, here is your private Secret Santa link! Tap to reveal who you got: ${link}`);
      const sRow = document.createElement("div");
      sRow.className = "share-row";
      sRow.innerHTML = `<span><strong>${giver}</strong></span> <a href="https://api.whatsapp.com/send?text=${waMsg}" target="_blank" class="btn-wa">Send WA</a>`;
      shareContainer.appendChild(sRow);
    });
  }

  function copyMasterHistory() {
    let text = "🎄 Gingerbread Gathering 2026 — Master Draw 🎄\\n\\n";
    PARTICIPANTS.forEach(name => {
      text += `${name} drew ${PAIRINGS_2026[name]}\\n`;
    });
    navigator.clipboard.writeText(text);
    alert("Copied entire master draw to clipboard! You can paste and save it into your Notes app.");
  }
</script>
</body>
</html>
