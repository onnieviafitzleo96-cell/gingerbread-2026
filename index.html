<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>🎄 Gingerbread's Gathering 2026 🎅</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary-red: #c0392b;
      --pine-green: #27ae60;
      --gold: #f39c12;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e3c72 0%, #0b1d3a 80%);
      color: #2c3e50;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      position: relative;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* Falling Snow */
    .snow {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      background-image: 
        radial-gradient(3px 3px at 20px 30px, #ffffff, transparent),
        radial-gradient(4px 4px at 80px 120px, #ffffffdd, transparent),
        radial-gradient(2px 2px at 150px 60px, #ffffff, transparent),
        radial-gradient(3px 3px at 240px 200px, #ffffff, transparent);
      background-size: 250px 250px;
      animation: snowFall 7s linear infinite;
      z-index: 1;
    }
    @keyframes snowFall {
      0% { background-position: 0 0, 0 0, 0 0; }
      100% { background-position: 40px 250px, 80px 250px, 30px 250px, 100px 250px; }
    }

    /* Floating Music Pill */
    .music-btn {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      padding: 0.5rem 0.9rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Main Festive Card */
    .card {
      background: rgba(255, 255, 255, 0.96);
      max-width: 420px;
      width: 100%;
      border-radius: 28px;
      padding: 2.2rem 1.8rem;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
      position: relative;
      z-index: 2;
      text-align: center;
      border: 3px solid rgba(212, 175, 55, 0.4);
    }
    .badge {
      display: inline-block;
      background: #c0392b;
      color: #fff;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 700;
      padding: 0.3rem 0.9rem;
      border-radius: 50px;
      margin-bottom: 0.8rem;
    }
    h1 {
      color: var(--primary-red);
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 0.3rem;
    }
    .user-greeting {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1a365d;
      margin-top: 0.5rem;
    }
    .user-sub {
      color: #666;
      font-size: 0.9rem;
      margin-top: 0.2rem;
      margin-bottom: 1.5rem;
    }

    /* Gift Area */
    .gift-interactive {
      background: #fdfaf6;
      border: 2px dashed #e2d7c5;
      border-radius: 20px;
      padding: 2rem 1.2rem;
      margin: 1rem 0;
    }
    .gift-icon {
      font-size: 4.8rem;
      display: inline-block;
      cursor: pointer;
      animation: wobble 2s infinite ease-in-out;
      user-select: none;
      -webkit-user-select: none;
    }
    @keyframes wobble {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-7deg) scale(1.04); }
      75% { transform: rotate(7deg) scale(1.04); }
    }
    .btn-reveal {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      color: #fff;
      border: none;
      font-size: 1.1rem;
      font-weight: bold;
      padding: 0.95rem;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 1.2rem;
      box-shadow: 0 4px 15px rgba(192, 57, 43, 0.35);
    }

    /* Revealed Result */
    .reveal-box {
      display: none;
      background: #fff;
      border: 2px solid var(--gold);
      border-radius: 18px;
      padding: 1.5rem 1rem;
      margin-top: 1.2rem;
      animation: popIn 0.35s ease forwards;
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .revealed-name {
      font-size: 2.3rem;
      color: var(--pine-green);
      font-weight: 900;
      margin: 0.4rem 0 0.8rem;
    }
    .btn-hide {
      background: #edf2f7;
      color: #4a5568;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 50px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Missing URL Warning */
    .invalid-box {
      background: #fff5f5;
      border: 1px solid #feb2b2;
      color: #c53030;
      padding: 1.2rem;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-top: 1rem;
    }

    /* Organizer Controls */
    .admin-toggle {
      margin-top: 1.8rem;
      font-size: 0.78rem;
      color: #a0aec0;
      cursor: pointer;
      text-decoration: underline;
    }
    .admin-panel {
      display: none;
      margin-top: 1rem;
      background: #f7fafc;
      border-radius: 16px;
      padding: 1.2rem;
      text-align: left;
      border: 1px solid #e2e8f0;
    }
    .admin-nav {
      display: flex;
      gap: 6px;
      margin-bottom: 0.8rem;
    }
    .admin-nav button {
      flex: 1;
      padding: 0.45rem;
      font-size: 0.75rem;
      border: 1px solid #cbd5e0;
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .admin-nav button.active {
      background: #2d3748;
      color: #fff;
      border-color: #2d3748;
    }
    .record-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.35rem 0;
      border-bottom: 1px solid #edf2f7;
      font-size: 0.85rem;
    }
    .btn-wa {
      background: #25d366;
      color: #fff;
      text-decoration: none;
      padding: 0.28rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .btn-copy {
      width: 100%;
      background: var(--pine-green);
      color: #fff;
      border: none;
      padding: 0.65rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="snow"></div>

  <!-- Music Toggle Button -->
  <button class="music-btn" id="musicBtn" onclick="userToggleMusic()">
    <span id="musicIcon">🎵</span> <span id="musicText">Play Music</span>
  </button>

  <!-- Reliable Cross-Platform HTML5 Audio (Directly streamed CDN MP3) -->
  <audio id="holidayAudio" preload="auto" loop playsinline webkit-playsinline>
    <source src="https://cdn.pixabay.com/download/audio/2022/11/27/audio_49666c0d8f.mp3?filename=we-wish-you-a-merry-christmas-126685.mp3" type="audio/mpeg">
  </audio>

  <div class="card">
    <div class="badge">Secret Santa 2026</div>
    <h1>Gingerbread's Gathering</h1>

    <!-- 1. Participant Screen -->
    <div id="participantScreen" style="display:none;">
      <div class="user-greeting" id="userNameGreeting">Hi there!</div>
      <p class="user-sub">Here is your Secret Santa gift draw.</p>

      <div class="gift-interactive">
        <div class="gift-icon" onclick="revealMatch()">🎁</div>
        <button class="btn-reveal" onclick="revealMatch()">🎁 Tap to Reveal</button>

        <div id="revealBox" class="reveal-box">
          <p style="font-size:0.85rem; color:#777; text-transform:uppercase; letter-spacing:1px; font-weight:600;">You are gifting:</p>
          <div class="revealed-name" id="matchNameDisplay">???</div>
          <button class="btn-hide" onclick="hideMatch()">🔒 Hide & Keep Secret</button>
        </div>
      </div>
    </div>

    <!-- 2. Missing User Link Warning -->
    <div id="unauthorizedScreen" style="display:none;" class="invalid-box">
      🎅 <strong>Private Invitation Only</strong><br><br>
      Please open the private link sent to your WhatsApp so you only see your own Secret Santa draw!
    </div>

    <!-- 3. Organizer Drawer -->
    <div class="admin-toggle" onclick="toggleAdmin()">⚙️ Organizer Control Panel</div>

    <div id="adminPanel" class="admin-panel">
      <div id="adminAuth">
        <p style="font-size:0.8rem; margin-bottom:0.5rem; color:#666;">Enter Organizer PIN:</p>
        <input type="password" id="adminPin" placeholder="PIN (2026)" style="width:100%; padding:0.5rem; margin-bottom:0.5rem; border:1px solid #ccc; border-radius:6px;" />
        <button onclick="unlockAdmin()" style="width:100%; padding:0.55rem; background:var(--primary-red); color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Unlock Master Records</button>
      </div>

      <div id="adminBody" style="display:none;">
        <div class="admin-nav">
          <button class="active" id="tabMasterBtn" onclick="switchAdminTab('master')">📋 Master List (2026)</button>
          <button id="tabShareBtn" onclick="switchAdminTab('share')">📲 WhatsApp Links</button>
        </div>

        <div id="tabMasterView">
          <div id="masterListContent"></div>
          <button class="btn-copy" onclick="copyMasterHistory()">📋 Copy Master Record</button>
        </div>

        <div id="tabShareView" style="display:none;">
          <div id="shareListContent"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Force iOS Safari to play audio even when hardware mute switch is engaged
    if ('audioSession' in navigator) {
      try {
        navigator.audioSession.type = 'playback';
      } catch (e) {}
    }

    const PAIRINGS_2026 = {
      "Pera": "Elzie",
      "Via": "Rozabelle",
      "Leara": "Pera",
      "Rozabelle": "Via",
      "Niki": "Gimbs",
      "Evelyn": "Merry",
      "Gadi": "Lulong",
      "Ching": "Niki",
      "Merry": "Evelyn",
      "Lulong": "Leara",
      "Gimbs": "Ching",
      "Elzie": "Gadi"
    };

    const PARTICIPANTS = Object.keys(PAIRINGS_2026);

    const params = new URLSearchParams(window.location.search);
    const rawUser = params.get('user');

    const participantScreen = document.getElementById("participantScreen");
    const unauthorizedScreen = document.getElementById("unauthorizedScreen");

    let matchedUser = null;
    if (rawUser) {
      matchedUser = PARTICIPANTS.find(p => p.toLowerCase() === rawUser.trim().toLowerCase());
    }

    if (matchedUser) {
      participantScreen.style.display = "block";
      document.getElementById("userNameGreeting").textContent = `👋 Hi ${matchedUser}!`;
    } else {
      unauthorizedScreen.style.display = "block";
    }

    /* --- Cross-Platform Audio Player --- */
    const audio = document.getElementById("holidayAudio");
    audio.volume = 0.5;
    let isPlaying = false;

    function playAudioSafe() {
      // Re-assert iOS playback category on user gesture
      if ('audioSession' in navigator) {
        try { navigator.audioSession.type = 'playback'; } catch (err) {}
      }

      audio.play().then(() => {
        isPlaying = true;
        document.getElementById("musicIcon").textContent = "⏸️";
        document.getElementById("musicText").textContent = "Pause";
      }).catch(err => {
        console.log("Audio unlock required gesture:", err);
      });
    }

    function pauseAudioSafe() {
      audio.pause();
      isPlaying = false;
      document.getElementById("musicIcon").textContent = "🎵";
      document.getElementById("musicText").textContent = "Play Music";
    }

    function userToggleMusic() {
      if (isPlaying) {
        pauseAudioSafe();
      } else {
        playAudioSafe();
      }
    }

    function revealMatch() {
      if (!matchedUser) return;

      // Start music automatically on iOS & Android upon tapping the gift box
      playAudioSafe();

      const receiver = PAIRINGS_2026[matchedUser];
      document.getElementById("matchNameDisplay").textContent = receiver;
      document.getElementById("revealBox").style.display = "block";

      confetti({
        particleCount: 85,
        spread: 70,
        origin: { y: 0.6 }
      });
    }

    function hideMatch() {
      document.getElementById("revealBox").style.display = "none";
    }

    /* --- Organizer Panel Logic --- */
    function toggleAdmin() {
      const panel = document.getElementById("adminPanel");
      panel.style.display = panel.style.display === "block" ? "none" : "block";
    }

    function unlockAdmin() {
      const pin = document.getElementById("adminPin").value;
      if (pin === "2026") {
        document.getElementById("adminAuth").style.display = "none";
        document.getElementById("adminBody").style.display = "block";
        buildAdminContent();
      } else {
        alert("Incorrect PIN");
      }
    }

    function switchAdminTab(tab) {
      document.getElementById("tabMasterView").style.display = (tab === 'master') ? 'block' : 'none';
      document.getElementById("tabShareView").style.display = (tab === 'share') ? 'block' : 'none';
      document.getElementById("tabMasterBtn").classList.toggle('active', tab === 'master');
      document.getElementById("tabShareBtn").classList.toggle('active', tab === 'share');
    }

    function buildAdminContent() {
      const masterBox = document.getElementById("masterListContent");
      const shareBox = document.getElementById("shareListContent");
      const baseUrl = window.location.origin + window.location.pathname;

      masterBox.innerHTML = "";
      shareBox.innerHTML = "";

      PARTICIPANTS.forEach(giver => {
        const rec = PAIRINGS_2026[giver];

        // Master List Row
        const mRow = document.createElement("div");
        mRow.className = "record-row";
        mRow.innerHTML = `<strong>${giver}</strong> ➔ <span style="color:#27ae60; font-weight:bold;">${rec}</span>`;
        masterBox.appendChild(mRow);

        // Share Link Row
        const link = `${baseUrl}?user=${encodeURIComponent(giver)}`;
        const waMsg = encodeURIComponent(`🎄 Gingerbread Gathering 2026: Hi ${giver}, here is your Secret Santa invite! Tap to see who you got: ${link}`);
        const sRow = document.createElement("div");
        sRow.className = "record-row";
        sRow.innerHTML = `<span><strong>${giver}</strong></span> <a href="https://api.whatsapp.com/send?text=${waMsg}" target="_blank" class="btn-wa">Send WhatsApp</a>`;
        shareBox.appendChild(sRow);
      });
    }

    function copyMasterHistory() {
      let text = "🎄 Gingerbread Gathering 2026 Master Draw 🎄\\n\\n";
      PARTICIPANTS.forEach(name => {
        text += `${name} drew ${PAIRINGS_2026[name]}\\n`;
      });
      navigator.clipboard.writeText(text);
      alert("Master list copied to clipboard! Save it to your notes for 2027.");
    }
  </script>
</body>
</html>
