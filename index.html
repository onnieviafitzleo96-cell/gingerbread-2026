<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gingerbread's Gathering 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --primary: #1976d2;
      --text: #2c3e50;
      --accent: #27ae60;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 1.5rem 1rem;
      min-height: 100vh;
    }
    .wrapper {
      background: var(--card-bg);
      max-width: 440px;
      width: 100%;
      border-radius: 24px;
      padding: 1.8rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    .header-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 0.25rem;
    }
    .header-sub {
      font-size: 0.88rem;
      color: #718096;
      margin-bottom: 1.25rem;
    }
    .active-user-banner {
      background: #ebf8ff;
      border: 1px solid #bee3f8;
      color: #2b6cb0;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 1rem;
      text-align: center;
    }
    .draw-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }
    .person-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fafafa;
      border: 1px solid #eef0f2;
      padding: 0.9rem 1.1rem;
      border-radius: 14px;
      transition: all 0.2s ease;
    }
    .person-row.is-me {
      background: #fff;
      border: 2px solid #3182ce;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(49, 130, 206, 0.12);
    }
    .person-name {
      font-weight: 600;
      font-size: 1rem;
      color: #2d3748;
    }
    .badge {
      font-size: 0.85rem;
      padding: 0.35rem 0.75rem;
      border-radius: 8px;
      font-weight: 600;
    }
    .badge-locked {
      background: #edf2f7;
      color: #a0aec0;
    }
    .badge-tap {
      background: #3182ce;
      color: #fff;
    }
    .badge-revealed {
      background: #c6f6d5;
      color: #22543d;
      font-weight: 700;
    }
    .admin-toggle {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #a0aec0;
      cursor: pointer;
    }
    .admin-box {
      display: none;
      margin-top: 1rem;
      padding: 1rem;
      background: #f7fafc;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      font-size: 0.85rem;
    }
    .share-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .btn-wa {
      background: #25d366;
      color: #fff;
      border: none;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="header-title">Gingerbread's Gathering 2026</div>
  <div class="header-sub">Christmas Exchange Gifts</div>

  <div id="userBanner" class="active-user-banner" style="display:none;"></div>

  <div class="draw-list" id="listContainer"></div>

  <div class="admin-toggle" onclick="toggleAdmin()">⚙️ Organizer Share Links</div>
  <div class="admin-box" id="adminBox">
    <div id="adminAuth">
      <input type="password" id="adminPin" placeholder="Organizer PIN (2026)" style="width:100%; padding:0.5rem; margin-bottom:0.5rem; border:1px solid #cbd5e0; border-radius:6px;" />
      <button onclick="unlockAdmin()" style="width:100%; padding:0.5rem; background:#3182ce; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Unlock Links</button>
    </div>
    <div id="adminLinks" style="display:none;">
      <p style="margin-bottom:0.75rem; color:#4a5568;">Send each person their private link so they can only open their own card:</p>
      <div id="linksList"></div>
    </div>
  </div>
</div>

<script>
  const PARTICIPANTS = [
    "Pera", "Via", "Leara", "Rozabelle", "Niki", 
    "Evelyn", "Gadi", "Ching", "Merry", "Lulong", "Gimbs", "Elzie"
  ];

  // 2025 past exclusions
  const EXCLUSIONS = {
    "Pera": "Merry",
    "Leara": "Gadi",
    "Niki": "Elzie",
    "Evelyn": "Via",
    "Gadi": "Ching",
    "Ching": "Leara",
    "Gimbs": "Pera"
  };

  const SEED_KEY = "gingerbread_2026_locked_pairings";

  function generateDraw() {
    let attempts = 0;
    while (attempts < 5000) {
      attempts++;
      let pool = [...PARTICIPANTS];
      let res = {};
      let fail = false;

      for (let giver of PARTICIPANTS) {
        let valid = pool.filter(p => p !== giver && EXCLUSIONS[giver] !== p);
        if (valid.length === 0) { fail = true; break; }
        let pick = valid[Math.floor(Math.random() * valid.length)];
        res[giver] = pick;
        pool = pool.filter(p => p !== pick);
      }
      if (!fail) return res;
    }
    return null;
  }

  // Consistent draw state
  let pairings = JSON.parse(localStorage.getItem(SEED_KEY));
  if (!pairings) {
    pairings = generateDraw();
    localStorage.setItem(SEED_KEY, JSON.stringify(pairings));
  }

  // Detect current user from URL (e.g., ?user=Via)
  const urlParams = new URLSearchParams(window.location.search);
  const currentUser = urlParams.get('user');

  const banner = document.getElementById("userBanner");
  if (currentUser && PARTICIPANTS.includes(currentUser)) {
    banner.style.display = "block";
    banner.textContent = `👋 Hello ${currentUser}! Tap your card below to unwrap your match.`;
  }

  const container = document.getElementById("listContainer");

  PARTICIPANTS.forEach(name => {
    const row = document.createElement("div");
    row.className = "person-row";

    const isMe = (currentUser && currentUser.toLowerCase() === name.toLowerCase());

    if (isMe) {
      row.classList.add("is-me");
      row.innerHTML = `
        <span class="person-name">${name}</span>
        <span class="badge badge-tap" id="badge-${name}">🎁 Tap to Reveal</span>
      `;
      row.onclick = () => revealRecipient(name);
    } else {
      row.innerHTML = `
        <span class="person-name">${name}</span>
        <span class="badge badge-locked">🔒 Hidden</span>
      `;
    }

    container.appendChild(row);
  });

  function revealRecipient(name) {
    const badge = document.getElementById(`badge-${name}`);
    if (badge.classList.contains("badge-revealed")) return;

    badge.className = "badge badge-revealed";
    badge.textContent = `drew ${pairings[name]}! 🎉`;

    confetti({
      particleCount: 80,
      spread: 60,
      origin: { y: 0.6 }
    });
  }

  function toggleAdmin() {
    const box = document.getElementById("adminBox");
    box.style.display = box.style.display === "block" ? "none" : "block";
  }

  function unlockAdmin() {
    const pin = document.getElementById("adminPin").value;
    if (pin === "2026") {
      document.getElementById("adminAuth").style.display = "none";
      const adminLinks = document.getElementById("adminLinks");
      adminLinks.style.display = "block";

      const list = document.getElementById("linksList");
      list.innerHTML = "";

      const baseUrl = window.location.origin + window.location.pathname;

      PARTICIPANTS.forEach(name => {
        const link = `${baseUrl}?user=${encodeURIComponent(name)}`;
        const waMsg = encodeURIComponent(`🎄 Gingerbread Gathering 2026: Hi ${name}, here is your private Secret Santa link! Tap to reveal who you got: ${link}`);
        const waUrl = `https://api.whatsapp.com/send?text=${waMsg}`;

        const item = document.createElement("div");
        item.className = "share-row";
        item.innerHTML = `
          <span><strong>${name}</strong></span>
          <a href="${waUrl}" target="_blank" class="btn-wa">Send WhatsApp</a>
        `;
        list.appendChild(item);
      });
    } else {
      alert("Incorrect PIN");
    }
  }
</script>
</body>
</html>
